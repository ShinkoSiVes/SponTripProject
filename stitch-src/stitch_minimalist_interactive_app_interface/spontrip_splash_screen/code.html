<style>
        .brutalist-button {
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px 0px #000000;
            transition: all 0.15s ease-out;
        }
        .brutalist-button:hover {
            box-shadow: 6px 6px 0px 0px #9D00FF;
            transform: translate(-2px, -2px);
        }
        .brutalist-button:active {
            box-shadow: 0px 0px 0px 0px #9D00FF;
            transform: translate(4px, 4px);
        }
        .brutalist-card {
            border: 2px solid #000000;

        .noise-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<div class="noise-bg"></div>

</div>

            Turn indecision into instant plans.
        </p>
<!-- CTA Button -->
<a class="brutalist-button bg-neon-cyan text-on-surface font-label-bold text-label-bold py-4 px-12 uppercase w-full max-w-sm flex items-center justify-center gap-2 group" href="#step2">
            Start Sponty Trip

</a>
</main>
