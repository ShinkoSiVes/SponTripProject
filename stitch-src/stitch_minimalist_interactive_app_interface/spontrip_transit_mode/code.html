<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar (Transactional - Hidden on main desktop nav if applicable, but requested by prompt) -->
<header class="bg-white border-b-2 border-black w-full top-0 sticky flex justify-between items-center px-margin-sm h-16 w-full z-40">
<button aria-label="Back" class="flex items-center justify-center p-2 rounded-DEFAULT hover:bg-surface-container transition-all duration-200">
<span class="material-symbols-outlined text-neon-cyan">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-black text-on-surface">Spontrip</div>
<div class="font-label-bold text-label-bold text-on-surface-variant">Step 7 of 8</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter md:p-margin-md pb-32">
<div class="w-full max-w-3xl flex flex-col gap-margin-md">
<!-- Heading Section -->
<div class="text-center">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-unit">Walking or Vehicle?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select your preferred mode of transit for this trip.</p>
</div>
<!-- Transit Mode Toggles (Bento-style Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-card-gap w-full">
<!-- Walking Option -->
<label class="cursor-pointer group relative block h-full">
<input class="peer sr-only" name="transit_mode" type="radio" value="walking"/>
<div class="h-full bg-white border-2 border-black p-margin-sm md:p-margin-md flex flex-col items-center justify-center gap-4 transition-all duration-200 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] peer-checked:bg-neon-cyan peer-checked:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_rgba(157,0,255,1)] hover:border-electric-purple active:translate-x-[2px] active:translate-y-[2px] active:shadow-none">
<span class="material-symbols-outlined text-[64px] leading-none peer-checked:text-on-primary-container group-hover:text-electric-purple transition-colors">directions_walk</span>
<span class="font-headline-md text-headline-md peer-checked:text-on-primary-container group-hover:text-electric-purple transition-colors">Walking</span>
</div>
</label>
<!-- Vehicle Option -->
<label class="cursor-pointer group relative block h-full">
<input checked="" class="peer sr-only" name="transit_mode" type="radio" value="vehicle"/>
<div class="h-full bg-white border-2 border-black p-margin-sm md:p-margin-md flex flex-col items-center justify-center gap-4 transition-all duration-200 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] peer-checked:bg-neon-cyan peer-checked:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_rgba(157,0,255,1)] hover:border-electric-purple active:translate-x-[2px] active:translate-y-[2px] active:shadow-none">
<span class="material-symbols-outlined text-[64px] leading-none peer-checked:text-on-primary-container group-hover:text-electric-purple transition-colors">directions_car</span>
<span class="font-headline-md text-headline-md peer-checked:text-on-primary-container group-hover:text-electric-purple transition-colors">Vehicle</span>
</div>
</label>
</div>
</div>
</main>
<!-- BottomNavBar (Transactional) -->
<nav class="fixed bottom-0 w-full z-50 bg-white border-t-2 border-black flex justify-between items-center p-gutter gap-gutter h-20">
<button class="flex-1 flex flex-col items-center justify-center py-2 px-4 rounded-DEFAULT bg-white text-on-surface border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100">
<span class="material-symbols-outlined mb-1">chevron_left</span>
<span class="font-label-bold text-label-bold">Back</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2 px-4 rounded-DEFAULT bg-neon-cyan text-on-primary-container border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100">
<span class="material-symbols-outlined mb-1">chevron_right</span>

</button>
