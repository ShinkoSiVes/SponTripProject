<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background min-h-screen flex flex-col font-body-lg text-on-surface antialiased relative overflow-x-hidden">
<!-- TopAppBar Shared Component -->
<!-- Applying exact styles from JSON: style_bg_color, style_component_shape, style_separation_logic, style_shell_layout, style_interactions -->
<header class="bg-white dark:bg-slate-dark w-full top-0 sticky border-b-2 border-black dark:border-white transition-all duration-200 flex justify-between items-center px-margin-sm h-16 z-50">
<!-- Leading Icon -->
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-neon-cyan dark:text-inverse-primary font-headline-md text-headline-md" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Headline / Brand -->
<div class="font-headline-md text-headline-md font-black text-on-surface dark:text-inverse-on-surface uppercase tracking-tight">
            Spontrip
        </div>
<!-- Trailing Action Text -->
<div class="text-neon-cyan dark:text-inverse-primary font-label-bold text-label-bold">
            Step 1 of 5
        </div>
</header>
<!-- Main Canvas Area -->
<!-- The Navigation shell is suppressed here because this is a transactional funnel step -->
<main class="flex-grow flex items-center justify-center p-gutter md:p-margin-lg relative z-10 w-full max-w-7xl mx-auto">
<!-- Decorative Background Elements (Neubrutalist style) -->
<div class="absolute top-10 left-10 w-32 h-32 bg-neon-cyan border-2 border-border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] opacity-20 -z-10 hidden md:block"></div>
<div class="absolute bottom-20 right-10 w-24 h-24 bg-electric-purple border-2 border-border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] opacity-20 -z-10 hidden md:block rounded-full"></div>
<!-- Step 11: Loop Prompt View -->
<section class="w-full max-w-2xl transition-all duration-500 transform opacity-100 translate-y-0" id="step-11-view">
<div class="bg-surface-container-lowest border-2 border-border-black shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] p-margin-md md:p-margin-lg flex flex-col gap-margin-md relative group hover:-translate-y-1 hover:-translate-x-1 hover:shadow-[16px_16px_0px_0px_rgba(0,0,0,1)] transition-transform duration-300">
<!-- Step Label -->
<div class="inline-block self-start border-2 border-border-black bg-surface-container px-3 py-1 font-label-sm text-label-sm uppercase tracking-wider mb-2">
                    Loop Decision
                </div>
<!-- Main Heading -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-xl md:text-headline-xl text-on-surface uppercase tracking-tighter">
                    Do you want to keep the sponty trip going?
                </h1>
<!-- Action Buttons -->
<div class="flex flex-col gap-gutter mt-card-gap">
<!-- YES Button -->
<button class="w-full bg-neon-cyan border-2 border-border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] text-on-surface font-label-bold text-label-bold uppercase py-4 px-6 flex justify-center items-center gap-2 hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all duration-150" id="btn-yes">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                        YES! Add another activity
                    </button>
<!-- NO Button -->
<button class="w-full bg-surface-container-lowest border-2 border-border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-on-surface font-label-bold text-label-bold uppercase py-4 px-6 flex justify-center items-center gap-2 hover:bg-surface-container hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-150" id="btn-no">
<span class="material-symbols-outlined" data-icon="close">close</span>
                        NO - End Trip
                    </button>
</div>
</div>
</section>
<!-- Step 12: Exit/Success View (Hidden initially) -->
<section class="hidden w-full max-w-3xl text-center flex flex-col items-center justify-center gap-margin-md transition-all duration-500 transform opacity-0 translate-y-8" id="step-12-view">
<div class="relative w-full aspect-[21/9] max-h-64 border-4 border-border-black shadow-[16px_16px_0px_0px_rgba(0,255,255,1)] mb-margin-md overflow-hidden bg-electric-purple">
<!-- Abstract neubrutalist background replacement instead of image to keep it snappy and on-brand, but prompt asked for 'minimalist neon-accented background' -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-neon-cyan via-electric-purple to-slate-dark mix-blend-multiply opacity-80"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-[8rem] text-white opacity-90 drop-shadow-[4px_4px_0px_rgba(0,0,0,1)]" data-icon="celebration">celebration</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-xl md:text-headline-xl text-on-surface max-w-2xl bg-white border-2 border-border-black p-gutter shadow-[8px_8px_0px_0px_rgba(157,0,255,1)]">
                Thank you for using Spontrip, enjoy your sponty trip!
            </h2>
<button class="mt-card-gap bg-white border-2 border-border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-on-surface font-label-bold text-label-bold uppercase py-3 px-8 hover:bg-surface-container hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-150" onclick="location.reload()">
                Start Over
            </button>
</section>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnNo = document.getElementById('btn-no');
            const step11View = document.getElementById('step-11-view');
            const step12View = document.getElementById('step-12-view');

            btnNo.addEventListener('click', () => {
                // Fade out Step 11
                step11View.classList.remove('opacity-100', 'translate-y-0');
                step11View.classList.add('opacity-0', '-translate-y-8');
                
                setTimeout(() => {
                    step11View.classList.add('hidden');
                    step12View.classList.remove('hidden');
                    
                    // Small delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        step12View.classList.remove('opacity-0', 'translate-y-8');
                        step12View.classList.add('opacity-100', 'translate-y-0');
                        
                        // Add a flash effect to the body for the neon exit
                        document.body.classList.add('bg-surface-container');
                    }, 50);
                }, 500); // Matches the duration-500 class
            });

            // YES button just does a generic click effect for demo
            const btnYes = document.getElementById('btn-yes');
            btnYes.addEventListener('click', () => {
                btnYes.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Processing...';
                setTimeout(() => {
                    btnYes.innerHTML = '<span class="material-symbols-outlined">add_circle</span> YES! Add another activity';
                }, 1000);
            });
        });
    </script>
</body></html>
