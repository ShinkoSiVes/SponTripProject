<style>
        .hard-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease;
        }
        .hard-shadow:hover {
            box-shadow: 8px 8px 0px 0px rgba(157,0,255,1);
            transform: translate(-4px, -4px);
        }
        .hard-shadow.selected {
            box-shadow: 4px 4px 0px 0px rgba(0,255,255,1);
            background-color: #00FFFF;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-16 pb-24">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-dark text-neon-cyan dark:text-inverse-primary font-headline-md text-headline-md w-full top-0 sticky border-b-2 border-black dark:border-white transition-all duration-200 flex justify-between items-center px-margin-sm h-16 w-full z-50">
<div class="flex items-center gap-2 hover:bg-surface-container p-2 cursor-pointer">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</div>
<div class="font-headline-md text-headline-md font-black text-on-surface dark:text-inverse-on-surface">Spontrip</div>
<div class="text-on-surface-variant font-body-md text-body-md">Step 3 of 8</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter w-full max-w-7xl mx-auto">
<div class="w-full max-w-4xl">
<!-- Header Section -->
<div class="mb-margin-md text-center">
<h1 class="font-headline-lg text-headline-lg md:font-headline-xl md:text-headline-xl mb-unit">What's the vibe?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select a theme for your spontaneous adventure.</p>
</div>
<!-- Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-card-gap w-full">
<!-- Card 1 -->
<button class="hard-shadow bg-surface-container-lowest border-2 border-border-black rounded p-margin-sm flex flex-col items-center justify-center gap-margin-sm min-h-[200px] group text-left w-full hover:bg-electric-purple hover:text-white group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-6xl group-hover:text-neon-cyan transition-colors" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-headline-md text-headline-md font-bold">Food &amp; Eats</span>
</button>
<!-- Card 2 -->
<button class="hard-shadow bg-surface-container-lowest border-2 border-border-black rounded p-margin-sm flex flex-col items-center justify-center gap-margin-sm min-h-[200px] group text-left w-full hover:bg-electric-purple hover:text-white group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-6xl group-hover:text-neon-cyan transition-colors" data-icon="directions_car" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<span class="font-headline-md text-headline-md font-bold">Short Trips</span>
</button>
<!-- Card 3 -->
<button class="hard-shadow bg-surface-container-lowest border-2 border-border-black rounded p-margin-sm flex flex-col items-center justify-center gap-margin-sm min-h-[200px] group text-left w-full hover:bg-electric-purple hover:text-white group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-6xl group-hover:text-neon-cyan transition-colors" data-icon="flight" style="font-variation-settings: 'FILL' 1;">flight</span>
<span class="font-headline-md text-headline-md font-bold">Off Country</span>
</button>
<!-- Card 4 -->
<button class="hard-shadow bg-surface-container-lowest border-2 border-border-black rounded p-margin-sm flex flex-col items-center justify-center gap-margin-sm min-h-[200px] group text-left w-full hover:bg-electric-purple hover:text-white group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-6xl group-hover:text-neon-cyan transition-colors" data-icon="sports_esports" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
<span class="font-headline-md text-headline-md font-bold">Entertainment</span>
