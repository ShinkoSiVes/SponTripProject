</div>
<div class="font-headline-md text-headline-md font-black text-on-surface dark:text-inverse-on-surface">Spontrip</div>

</div>

<span class="material-symbols-outlined text-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>

<div class="bg-surface border-2 border-black p-3 flex items-center gap-3 hard-shadow hover:translate-x-[-2px] hover:translate-y-[-2px] hover:hard-shadow-cyan transition-all">

<span class="material-symbols-outlined" data-icon="directions_walk">directions_walk</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-slate-muted">Distance</p>
<p class="font-body-md text-body-md font-bold text-on-surface">1.2 km</p>
</div>
</div>
<div class="bg-surface border-2 border-black p-3 flex items-center gap-3 hard-shadow hover:translate-x-[-2px] hover:translate-y-[-2px] hover:hard-shadow-cyan transition-all">
