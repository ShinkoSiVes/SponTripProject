<style>
        .brutalist-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
        }
        .brutalist-shadow-hover:hover {
            box-shadow: 8px 8px 0px 0px rgba(157,0,255,1);
            transform: translate(-2px, -2px);
        }
        .brutalist-shadow-active:active {
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        .pill-selected {
            background-color: #00FFFF;
            font-weight: 700;

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-white dark:bg-slate-dark border-b-2 border-black dark:border-white z-50">
<div class="flex justify-between items-center px-margin-sm h-16 w-full max-w-7xl mx-auto">
<button class="flex items-center justify-center p-2 text-on-surface-variant hover:bg-surface-container transition-all duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-black text-on-surface dark:text-inverse-on-surface">Spontrip</h1>
<span class="font-label-bold text-label-bold text-on-surface-variant">Step 1 of 5</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-gutter md:p-margin-md pb-24 md:pb-margin-md">
<!-- Interactive Card -->
<div class="bg-white border-2 border-black w-full max-w-2xl mx-auto p-margin-md md:p-margin-lg relative">
<span class="absolute top-4 left-4 font-label-bold text-label-bold bg-black text-white px-2 py-1">Step 2</span>
<div class="mt-8">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-margin-sm">What do you want to do?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-margin-md">Enter a custom idea or pick from our quick suggestions.</p>
<!-- Input Field -->
<div class="relative mb-margin-lg group">
<input class="w-full bg-white border border-black p-4 font-body-lg text-body-lg outline-none focus:border-neon-cyan focus:border-2 transition-all duration-100 placeholder-outline-variant" placeholder="e.g. Find a quiet cafe to read..." type="text"/>
<div class="absolute inset-0 border-2 border-neon-cyan pointer-events-none opacity-0 group-focus-within:opacity-100 group-focus-within:translate-x-1 group-focus-within:translate-y-1 transition-all duration-100 z-[-1]"></div>
</div>
<!-- Quick Categories -->
<div>
<h3 class="font-label-bold text-label-bold text-slate-muted mb-unit">Quick Ideas</h3>
<div class="flex flex-wrap gap-3">
<button class="pill bg-white border border-black px-4 py-2 font-body-md text-body-md hover:bg-surface-container transition-colors duration-150">Eat something</button>
<button class="pill bg-white border border-black px-4 py-2 font-body-md text-body-md hover:bg-surface-container transition-colors duration-150">Go somewhere</button>
<button class="pill bg-white border border-black px-4 py-2 font-body-md text-body-md hover:bg-surface-container transition-colors duration-150">Hang out</button>
<button class="pill bg-white border border-black px-4 py-2 font-body-md text-body-md hover:bg-surface-container transition-colors duration-150">Be active</button>
<button class="pill bg-white border border-black px-4 py-2 font-body-md text-body-md hover:bg-surface-container transition-colors duration-150">Learn something new</button>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Primary Nav) -->
<nav class="fixed bottom-0 w-full z-50 bg-white dark:bg-slate-dark border-t-2 border-black dark:border-white">
<div class="flex justify-between items-center p-gutter gap-gutter max-w-7xl mx-auto">
<button class="flex items-center gap-2 px-4 py-3 bg-white text-on-surface border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-surface-container transition-all duration-100 font-label-bold text-label-bold">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
                Back
            </button>
<button class="flex items-center gap-2 px-6 py-3 bg-neon-cyan text-on-primary-container border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100 font-label-bold text-label-bold">
                Next
                <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</nav>
<script>
        // Simple Pill Selection Logic
        document.querySelectorAll('.pill').forEach(pill => {
            pill.addEventListener('click', function() {
                // Toggle selection for this pill
                this.classList.toggle('bg-neon-cyan');
                this.classList.toggle('font-bold');
                this.classList.toggle('bg-white');
            });
        });
    </script>
