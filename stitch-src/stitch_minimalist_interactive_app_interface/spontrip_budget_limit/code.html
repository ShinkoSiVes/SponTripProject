<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spontrip - Budget Selection</title>

                            "surface-container-high": "#e8e8e8",

                            "on-error": "#ffffff",
                            "on-primary-fixed": "#002020",

                            "on-secondary-container": "#f7e6ff",
                            "primary-fixed": "#00fbfb",
                            "on-primary-container": "#007272",

                            "on-tertiary-fixed-variant": "#404758",
                            "surface-container-low": "#f3f3f4",
                            "surface-tint": "#006a6a",
                            "on-secondary": "#ffffff",

                            "surface": "#f9f9f9",
                            "on-primary": "#ffffff",
                            "primary": "#006a6a",
                            "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",
                            "lg": "0.25rem",
                            "xl": "0.5rem",

            }

<style>
        .brutalist-card-selected {
            background-color: #00FFFF; /* neon-cyan */
            box-shadow: 8px 8px 0px 0px rgba(157,0,255,1); /* electric-purple */
            transform: translate(-2px, -2px);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pt-16 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-dark text-neon-cyan dark:text-inverse-primary w-full top-0 sticky border-b-2 border-black dark:border-white transition-all duration-200 flex justify-between items-center px-margin-sm h-16 z-50">
<button class="text-on-surface-variant hover:bg-surface-container transition-all duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-black text-on-surface dark:text-inverse-on-surface">
            Spontrip
        </div>
<div class="font-label-sm text-label-sm text-on-surface-variant">
            Step 7 of 8
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter md:px-margin-lg">
<div class="w-full max-w-2xl">
<!-- Step Heading -->
<div class="mb-margin-md text-center">
<span class="font-label-bold text-label-bold text-electric-purple uppercase tracking-widest mb-2 block">Step 7</span>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface font-black">
                    How much are you willing to spend?
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit-2">
                    Select a budget tier for your spontaneous getaway.
                </p>
</div>
<!-- Budget Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-card-gap">
<!-- Tier 1: Budget -->
<button class="budget-option group relative bg-white border-2 border-black p-6 flex flex-col items-center justify-center text-center transition-all duration-200 hover:bg-surface-container hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 active:translate-y-0 active:shadow-none focus:outline-none focus:ring-4 focus:ring-neon-cyan focus:ring-offset-2" type="button">
<span class="material-symbols-outlined text-4xl mb-4 text-on-surface group-hover:text-electric-purple transition-colors">wallet</span>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">$ Budget</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Keep it lean.</p>
</button>
<!-- Tier 2: Moderate -->
<button class="budget-option group relative bg-white border-2 border-black p-6 flex flex-col items-center justify-center text-center transition-all duration-200 brutalist-card-selected hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] hover:-translate-y-1 active:translate-y-0 active:shadow-none focus:outline-none focus:ring-4 focus:ring-neon-cyan focus:ring-offset-2" type="button">
<span class="material-symbols-outlined text-4xl mb-4 text-on-surface">payments</span>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">$$ Moderate</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Comfortable.</p>
</button>
<!-- Tier 3: Splurge -->
<button class="budget-option group relative bg-white border-2 border-black p-6 flex flex-col items-center justify-center text-center transition-all duration-200 hover:bg-surface-container hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 active:translate-y-0 active:shadow-none focus:outline-none focus:ring-4 focus:ring-neon-cyan focus:ring-offset-2" type="button">
<span class="material-symbols-outlined text-4xl mb-4 text-on-surface group-hover:text-electric-purple transition-colors">diamond</span>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">$$$ Splurge</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Treat yourself.</p>
</button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only as per shell visibility logic, but rendered here to fulfill requirements) -->
<nav class="bg-white dark:bg-slate-dark text-neon-cyan dark:text-inverse-primary font-label-bold text-label-bold fixed bottom-0 w-full z-50 border-t-2 border-black dark:border-white transition-all duration-100 flex justify-between items-center p-gutter gap-gutter md:hidden">
<button class="bg-white text-on-surface border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100 flex items-center justify-center px-4 py-3 w-1/2">
<span class="material-symbols-outlined mr-2">chevron_left</span>
            Back
        </button>
<button class="bg-neon-cyan text-on-primary-container border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100 flex items-center justify-center px-4 py-3 w-1/2">
            Next
            <span class="material-symbols-outlined ml-2">chevron_right</span>
</button>
</nav>
<!-- Desktop Navigation Actions (Rendered as main content for desktop) -->
<div class="hidden md:flex justify-between w-full max-w-2xl mx-auto px-margin-lg pb-margin-lg mt-margin-md">
<button class="bg-white text-on-surface border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100 flex items-center justify-center px-6 py-3 font-label-bold text-label-bold">
<span class="material-symbols-outlined mr-2">chevron_left</span>
            Back
        </button>
<button class="bg-neon-cyan text-on-primary-container border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-electric-purple hover:text-white hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[8px_8px_0px_0px_rgba(157,0,255,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all duration-100 flex items-center justify-center px-8 py-3 font-label-bold text-label-bold text-lg">
            Next
            <span class="material-symbols-outlined ml-2">chevron_right</span>
</button>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.budget-option');
            
            options.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove selected state from all
                    options.forEach(opt => {
                        opt.classList.remove('brutalist-card-selected');
                        opt.classList.add('hover:bg-surface-container', 'hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]');
                        // Reset icon color
                        const icon = opt.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-on-surface'); // Assuming selected doesn't need specific icon color, but normal does
                    });

                    // Add selected state to clicked
                    this.classList.add('brutalist-card-selected');
                    this.classList.remove('hover:bg-surface-container', 'hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]');
                    
                });
            });
        });
    </script>
</body></html>
